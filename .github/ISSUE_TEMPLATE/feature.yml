name: Feature request
description: Suggest an improvement to a game or the hub
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Game or area
      options:
        - Hub
        - Pixel Quest (idham-rpg)
        - Pixel Brawl (axhad-fighter)
        - Shared package
        - Template
        - Scripts
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like, and why?
    validations:
      required: true
